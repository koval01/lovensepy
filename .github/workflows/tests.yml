name: Tests

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  webui:
    name: Web control panel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

      - name: Check the service can serve the built panel
        run: |
          test -f lovensepy/services/http_api/webui_dist/index.html
          ls lovensepy/services/http_api/webui_dist/assets

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff
        run: ruff check lovensepy tests && ruff format --check lovensepy tests

      - name: Run unit and fast tests (with coverage)
        run: |
          pytest \
            tests/test_unit.py \
            tests/test_async_clients.py \
            tests/test_socket_client_unit.py \
            tests/test_home_assistant_mqtt_unit.py \
            tests/test_ble_direct_unit.py \
            tests/test_ble_direct_hub_unit.py \
            tests/test_ble_direct_sync_hub_unit.py \
            tests/test_uart_replies.py \
            tests/test_ble_uart_catalog.py \
            tests/test_transport_ws_unit.py \
            tests/test_socket_api_cleanup_unit.py \
            tests/test_service_fastapi.py \
            tests/test_service_state_and_webui.py \
            tests/test_ble_supervisor_unit.py \
            tests/test_tunnel_unit.py \
            tests/test_access_gate_unit.py \
            tests/test_ble_scan_advertisements.py \
            -v --cov=lovensepy --cov-report=term-missing

      - name: Run pylint
        run: pylint lovensepy

      - name: Run bandit
        run: bandit -r lovensepy -f txt

      - name: Run semgrep
        run: |
          semgrep scan --config auto lovensepy --error \
            --exclude-rule python.lang.compatibility.python37.python37-compatibility-importlib2

      # Known ignores (dev-tool transitive deps; not shipped with the library wheel):
      # - pygments (via pytest/rich): GHSA-5239-wwwm-4pmq — historically unfixed on PyPI
      # - mcp (pinned by semgrep==1.172): PYSEC-2026-3481/3482/3483 — fixed in mcp>=1.28.1
      - name: Check dependencies for vulnerabilities
        run: |
          pip-audit \
            --ignore-vuln GHSA-5239-wwwm-4pmq \
            --ignore-vuln PYSEC-2026-3481 \
            --ignore-vuln PYSEC-2026-3482 \
            --ignore-vuln PYSEC-2026-3483
